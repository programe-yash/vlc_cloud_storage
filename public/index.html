<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLC Web Cloud Storage</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Auth Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-content">
      <div class="vlc-logo">
        <div class="cone"></div>
        <span>VLC Media Cloud</span>
      </div>

      <div class="auth-tabs">
        <button id="tabLoginBtn" class="active">Login</button>
        <button id="tabRegisterBtn">Register</button>
      </div>

      <input type="text" id="userInput" placeholder="Username" autocomplete="off">
      <input type="password" id="passwordInput" placeholder="Password">
      <button id="authSubmitBtn">Login</button>

      <p id="errorMsg" class="error-msg"></p>
      <p id="successMsg" class="success-msg"></p>
    </div>
  </div>

  <!-- Real-Time Upload Progress Status Overlay -->
  <div id="uploadStatusModal" class="upload-status-overlay hidden">
    <div class="upload-status-card">
      <div class="upload-header">
        <span>⬆ Uploading Media Batch...</span>
        <span id="uploadPercentage">0%</span>
      </div>
      
      <div class="progress-bar-container">
        <div id="overallProgressBar" class="progress-bar-fill"></div>
      </div>
      
      <div id="uploadDetails" class="upload-details">
        <span id="uploadSpeed">0 KB/s</span>
        <span id="uploadCount">0 / 0 Files</span>
      </div>

      <div id="fileListProgress" class="file-list-progress"></div>
      
      <button id="closeUploadBtn" class="hidden">Done</button>
    </div>
  </div>

  <!-- Main VLC Interface -->
  <div class="vlc-container hidden" id="mainContent">
    <header class="vlc-header">
      <div class="vlc-logo">
        <div class="cone"></div>
        <span>VLC Cloud</span>
      </div>
      <div class="user-info">
        👤 <span id="currentUser"></span>
      </div>
      <div class="header-actions">
        <label class="upload-btn">
          ⬆ Upload Batch
          <input type="file" id="fileInput" accept="video/*,image/*" multiple hidden>
        </label>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </header>

    <!-- VLC Viewport with Speed Controls -->
    <main class="vlc-viewport" id="dropZone">
      <video id="vlcPlayer" class="active-media" controls></video>
      <img id="vlcImageViewer" class="active-media hidden" alt="Selected Media">
      
      <!-- Custom Speed Control Overlay (No inline handlers) -->
      <div id="speedControls" class="speed-controls hidden">
        <span>Speed:</span>
        <button class="speed-btn" data-speed="0.5">0.5x</button>
        <button class="speed-btn" data-speed="1.0">1.0x</button>
        <button class="speed-btn" data-speed="1.25">1.25x</button>
        <button class="speed-btn" data-speed="1.5">1.5x</button>
        <button class="speed-btn" data-speed="2.0">2.0x</button>
      </div>

      <div id="dragDropHint" class="drag-hint hidden">Drop media files here to upload</div>
    </main>

    <!-- Playlist Controls, Search & Batch Action Bar -->
    <section class="vlc-playlist-section">
      <div class="playlist-header-controls">
        <div class="tabs">
          <button class="tab-btn active" id="btnVideos">🎬 Videos</button>
          <button class="tab-btn" id="btnImages">🖼 Images</button>
        </div>

        <div class="search-sort-bar">
          <input type="text" id="searchInput" placeholder="🔍 Search media...">
          <select id="sortSelect">
            <option value="date-desc">Newest First</option>
            <option value="date-asc">Oldest First</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="size-desc">Size (Largest)</option>
          </select>
        </div>
      </div>

      <!-- Bulk Actions Bar -->
      <div class="batch-actions-bar">
        <label><input type="checkbox" id="selectAllCheckbox"> Select All</label>
        <div class="batch-buttons">
          <button id="batchDownloadBtn">⬇ Download ZIP</button>
          <button id="batchDeleteBtn" class="danger-btn">🗑 Delete Selected</button>
        </div>
      </div>

      <ul id="mediaList" class="playlist"></ul>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
